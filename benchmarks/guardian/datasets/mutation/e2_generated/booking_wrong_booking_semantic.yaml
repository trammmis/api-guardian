openapi: 3.0.3
info:
  title: Guardian Benchmark Booking API
  version: 2.0.0
paths:
  /bookings/primary:
    get:
      operationId: getPrimaryBooking
      responses:
        '200':
          description: Booking
          content:
            application/json:
              schema:
                type: object
                required:
                - id
                - guest
                - nights
                - status
                properties:
                  id:
                    type: integer
                  guest:
                    type: string
                  nights:
                    type: integer
                  status:
                    type: string
                    enum:
                    - confirmed
                    - cancelled
  /bookings:
    get:
      operationId: listBookings
      responses:
        '200':
          description: Bookings
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required:
                  - id
                  - guest
                  - nights
                  - status
                  properties:
                    id:
                      type: string
                    guest:
                      type: string
                    nights:
                      type: integer
                    status:
                      type: string
                      enum:
                      - confirmed
                      - cancelled
  /rooms/primary:
    get:
      operationId: getPrimaryRoom
      responses:
        '200':
          description: Room
          content:
            application/json:
              schema:
                type: object
                required:
                - id
                - name
                - capacity
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  capacity:
                    type: integer
  /rooms:
    get:
      operationId: listRooms
      responses:
        '200':
          description: Rooms
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required:
                  - id
                  - name
                  - capacity
                  properties:
                    id:
                      type: string
                    name:
                      type: string
                    capacity:
                      type: integer
  /guests/primary:
    get:
      operationId: getPrimaryGuest
      responses:
        '200':
          description: Guest
          content:
            application/json:
              schema:
                type: object
                required:
                - id
                - name
                - vip
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  vip:
                    type: boolean
  /payments/latest:
    get:
      operationId: getLatestPayment
      responses:
        '200':
          description: Payment
          content:
            application/json:
              schema:
                type: object
                required:
                - id
                - amount
                - currency
                properties:
                  id:
                    type: string
                  amount:
                    type: number
                  currency:
                    type: string
  /availability/current:
    get:
      operationId: getCurrentAvailability
      responses:
        '200':
          description: Availability
          content:
            application/json:
              schema:
                type: object
                required:
                - id
                - rooms
                - date
                properties:
                  id:
                    type: string
                  rooms:
                    type: integer
                  date:
                    type: string
  /status:
    get:
      operationId: getBookingStatus
      responses:
        '200':
          description: Status
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - region
                properties:
                  status:
                    type: string
                    enum:
                    - ok
                  region:
                    type: string
